<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akış İstasyonu | Odaklanma Aracı</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--
      ===================== SÜZÜLEN ARKAPLAN NESNELERİ =====================
      .floating-bg-elements: Sayfanın İÇERİĞİNİN (.app-container) ARKASINDA, 
      TÜM ekranı kaplayan, TIKLANAMAZ (pointer-events: none) bir dekor 
      katmanı. Neden .app-container'ın DIŞINA, body'nin doğrudan çocuğu 
      olarak koyuyoruz? Modal'da uyguladığımız aynı mantık: "position: 
      fixed" ile TÜM VİEWPORT'u kaplaması gerekiyor, bu yüzden herhangi bir 
      ebeveynin (örn. .app-container'ın olası bir "transform" özelliğinin) 
      konumlandırmayı bozmasını istemiyoruz.

      Her <span>, TEK bir emojiyi temsil ediyor. aria-hidden="true" 
      koyuyoruz çünkü bunlar SALT DEKORATİF — ekran okuyucuların bu 
      emojileri anlamlı içerik gibi okumasını istemiyoruz.

      Inline style içindeki CSS DEĞİŞKENLERİ (--left, --duration, --delay, 
      --size, --drift), her elemanın style.css'teki AYNI @keyframes 
      animasyonunu farklı hızda/boyutta/gecikmeyle, yani birbirinden 
      BAĞIMSIZ ve DOĞAL görünecek şekilde çalıştırmasını sağlıyor. Aksi 
      halde 10 emoji birebir aynı anda, aynı hızda hareket ederdi ve bu 
      "organik" değil, mekanik/tekrarlı bir görünüm verirdi.
    -->
    <div class="floating-bg-elements" aria-hidden="true">
        <span class="floating-item" style="--left: 4%;  --size: 1.4rem; --duration: 22s; --delay: 0s;  --drift: 30px;">🌸</span>
        <span class="floating-item" style="--left: 14%; --size: 1.1rem; --duration: 17s; --delay: 3s;  --drift: -20px;">✨</span>
        <span class="floating-item" style="--left: 24%; --size: 1.6rem; --duration: 26s; --delay: 6s;  --drift: 15px;">💖</span>
        <span class="floating-item" style="--left: 36%; --size: 1.2rem; --duration: 19s; --delay: 1s;  --drift: -25px;">⭐</span>
        <span class="floating-item" style="--left: 48%; --size: 1.5rem; --duration: 24s; --delay: 8s;  --drift: 20px;">🎀</span>
        <span class="floating-item" style="--left: 58%; --size: 1.3rem; --duration: 20s; --delay: 4s;  --drift: -15px;">☁️</span>
        <span class="floating-item" style="--left: 68%; --size: 1.1rem; --duration: 18s; --delay: 10s; --drift: 25px;">✨</span>
        <span class="floating-item" style="--left: 78%; --size: 1.5rem; --duration: 23s; --delay: 2s;  --drift: -30px;">🌸</span>
        <span class="floating-item" style="--left: 88%; --size: 1.2rem; --duration: 21s; --delay: 7s;  --drift: 10px;">💖</span>
        <span class="floating-item" style="--left: 94%; --size: 1.3rem; --duration: 25s; --delay: 5s;  --drift: -10px;">🎀</span>
    </div>

    <div class="app-container">

        <!-- ===================== ÜST BAŞLIK (HEADER) ===================== -->
        <header class="app-header">
            <h1 class="app-title">Akış İstasyonu</h1>
            <p class="app-subtitle">Odaklan. Miksle. Devam et.</p>
        </header>

        <main class="app-main">

            <!-- ===================== SAYAÇ PANELİ (POMODORO) ===================== -->
            <section class="panel timer-panel" aria-label="Odaklanma Sayacı">

                <div class="mode-switcher">
                    <button class="mode-btn is-active" type="button" data-mode="focus">Odaklanma</button>
                    <button class="mode-btn" type="button" data-mode="break">Mola</button>
                </div>

                <div class="timer-display">
                    <span id="timer-minutes">25</span>
                    <span class="timer-colon">:</span>
                    <span id="timer-seconds">00</span>
                </div>

                <div class="progress-track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-fill"></div>
                </div>

                <div class="timer-controls">
                    <button id="btn-reset" class="control-btn control-btn--ghost" type="button" title="Sıfırla">
                        Sıfırla
                    </button>
                    <button id="btn-start-pause" class="control-btn control-btn--primary" type="button" title="Başlat">
                        Başlat
                    </button>
                    <button id="btn-settings" class="control-btn control-btn--ghost" type="button" title="Ayarlar">
                        Süre
                    </button>
                </div>
            </section>

            <!-- ===================== SES MİKSER PANELİ ===================== -->
            <section class="panel mixer-panel" aria-label="Ortam Sesi Mikseri">

                <h2 class="panel-heading">Ortam Sesleri</h2>

                <div class="sound-row" data-sound="rain" data-default-volume="30">
                    <div class="sound-icon" aria-hidden="true">🌧️</div>
                    <div class="sound-info">
                        <label class="sound-label" for="slider-rain">Yağmur</label>
                        <input type="range" id="slider-rain" class="sound-slider" min="0" max="100" value="0">
                    </div>
                    <span class="sound-value">0%</span>
                    <button class="sound-toggle-btn" type="button" aria-label="Yağmur sesini oynat">▶</button>
                </div>

                <div class="sound-row" data-sound="cafe" data-default-volume="30">
                    <div class="sound-icon" aria-hidden="true">☕</div>
                    <div class="sound-info">
                        <label class="sound-label" for="slider-cafe">Kafe Ortamı</label>
                        <input type="range" id="slider-cafe" class="sound-slider" min="0" max="100" value="0">
                    </div>
                    <span class="sound-value">0%</span>
                    <button class="sound-toggle-btn" type="button" aria-label="Kafe ortamı sesini oynat">▶</button>
                </div>

                <div class="sound-row" data-sound="fireplace" data-default-volume="30">
                    <div class="sound-icon" aria-hidden="true">🔥</div>
                    <div class="sound-info">
                        <label class="sound-label" for="slider-fireplace">Şömine</label>
                        <input type="range" id="slider-fireplace" class="sound-slider" min="0" max="100" value="0">
                    </div>
                    <span class="sound-value">0%</span>
                    <button class="sound-toggle-btn" type="button" aria-label="Şömine sesini oynat">▶</button>
                </div>

                <!-- Ses Satırı 4: Kitap Sayfası -->
                <div class="sound-row" data-sound="book" data-default-volume="30">
                    <div class="sound-icon" aria-hidden="true">📖</div>
                    <div class="sound-info">
                        <label class="sound-label" for="slider-book">Kitap Sayfası</label>
                        <input type="range" id="slider-book" class="sound-slider" min="0" max="100" value="0">
                    </div>
                    <span class="sound-value">0%</span>
                    <button class="sound-toggle-btn" type="button" aria-label="Kitap sayfası sesini oynat">▶</button>
                </div>

                <!-- Ses Satırı 5: Klavye -->
                <div class="sound-row" data-sound="keyboard" data-default-volume="30">
                    <div class="sound-icon" aria-hidden="true">⌨️</div>
                    <div class="sound-info">
                        <label class="sound-label" for="slider-keyboard">Klavye</label>
                        <input type="range" id="slider-keyboard" class="sound-slider" min="0" max="100" value="0">
                    </div>
                    <span class="sound-value">0%</span>
                    <button class="sound-toggle-btn" type="button" aria-label="Klavye sesini oynat">▶</button>
                </div>

            </section>

        </main>

        <footer class="app-footer">
            <p>Vanilla HTML · CSS · JavaScript ile inşa edildi.</p>
        </footer>

    </div>

    <!-- ===================== AYAR KARTI (MODAL) ===================== -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h2 class="modal-title">Özel Süre Ayarı</h2>
            <p class="modal-description">Yeni odaklanma süresini dakika cinsinden girin.</p>

            <input
                type="number"
                id="modal-minutes-input"
                class="modal-input"
                min="1"
                placeholder="25"
            >

            <div class="modal-actions">
                <button id="modal-cancel-btn" class="control-btn control-btn--ghost" type="button">Vazgeç</button>
                <button id="modal-save-btn" class="control-btn control-btn--primary" type="button">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
